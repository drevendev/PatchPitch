name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    # Standard public runner only; skip private repositories.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
        # Browser/API tests are MOCK. LIVE_MODEL requires a separate local Ollama.
  package:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.6.1 setuptools==84.2.0 wheel==0.48.0
      - name: Build wheel and source archive
        run: python -m build --no-isolation
      - name: Verify source archive test collection
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-dev.lock
          mkdir "$RUNNER_TEMP/source-smoke"
          tar -xf dist/patchpitch-*.tar.gz -C "$RUNNER_TEMP/source-smoke"
          cd "$RUNNER_TEMP/source-smoke"/patchpitch-*
          python -m pytest --collect-only -q -rs
      - name: Install wheel into an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/package-venv"
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install dist/patchpitch-*.whl
      - name: Verify installed CLI without UI or model requests
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-venv/bin/python" -c "import importlib.util as u; from importlib.metadata import version; import patchpitch, patchpitch.campaigns; assert patchpitch.__version__ == version('patchpitch'); assert u.find_spec('fastapi') is None; assert u.find_spec('uvicorn') is None; assert u.find_spec('playwright') is None"
          "$RUNNER_TEMP/package-venv/bin/python" -m patchpitch run --job "$GITHUB_WORKSPACE/examples/headless/release.toml" --out "$RUNNER_TEMP/package-plan" --plan --json </dev/null
          "$RUNNER_TEMP/package-venv/bin/patchpitch" schema --kind job --out "$RUNNER_TEMP/job-schema.json" --json </dev/null
      - name: Record archive hashes
        run: |
          (cd dist && sha256sum *) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: patchpitch-dist-${{ github.sha }}
          path: dist/
          retention-days: 14
  quillgrain:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: drevendev/Quillgrain
          ref: 8af17f979c0ad20163bec5fd247279a7a6f5addf
          path: .tools/quillgrain
          persist-credentials: false
      - run: python -m pip install -r requirements-dev.txt -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation ./.tools/quillgrain
      - name: Require the verified engine
        run: |
          python -c "from importlib.metadata import version; import quillgrain.consumer; assert version('quillgrain') == '0.1.0rc3'"
      - run: python -m playwright install --with-deps chromium
      - name: Run voice and campaign integration checks
        run: python -m pytest -q tests/test_voice.py tests/test_voice_browser.py tests/test_campaign_git_voice.py --junitxml=quillgrain-results.xml
      - name: Reject skipped integration checks
        run: |
          python -c "import xml.etree.ElementTree as E; suites = list(E.parse('quillgrain-results.xml').getroot().iter('testsuite')); assert suites and sum(int(s.get('tests', 0)) for s in suites) > 0; assert sum(int(s.get('skipped', 0)) for s in suites) == 0, 'Quillgrain checks must not skip'"
